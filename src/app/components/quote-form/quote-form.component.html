<section id="cotizar" class="py-12 sm:py-16 bg-[#F8FAFC]">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">

    <div class="bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
      <div class="grid grid-cols-1 lg:grid-cols-2">

        <!-- Left: WhatsApp direct — compact on mobile -->
        <div class="bg-[#0A1F33] p-7 sm:p-8 lg:p-10 flex flex-col justify-center space-y-5 sm:space-y-6">
          <div>
            <p class="text-[#C58B59] text-xs font-bold uppercase tracking-widest mb-2">Contacto inmediato</p>
            <h2 class="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-white font-headline leading-tight">
              ¿Te quedaste<br/>sin batería?
            </h2>
            <p class="text-slate-400 text-sm mt-2">Un especialista llega a donde estás.</p>
          </div>

          <button
            (click)="whatsapp.openEmergencyDispatch()"
            class="w-full py-3.5 sm:py-4 px-6 rounded-2xl bg-[#25D366] hover:bg-[#1EBE5D] text-white font-bold text-sm sm:text-base transition-all shadow-lg flex items-center justify-center gap-3 cursor-pointer hover:-translate-y-0.5"
            id="cta-form-direct-whatsapp"
          >
            <svg class="w-5 h-5 sm:w-6 sm:h-6 fill-current shrink-0" viewBox="0 0 24 24">
              <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.598 2.664-.699c.991.543 1.99.829 2.796.829 3.182 0 5.768-2.587 5.768-5.766.001-3.181-2.584-5.765-5.768-5.765zm0-1.872c4.218 0 7.64 3.422 7.64 7.638 0 4.217-3.422 7.638-7.64 7.638-1.328 0-2.579-.344-3.673-.949l-4.358 1.143 1.164-4.249c-.689-1.15-1.073-2.493-1.073-3.923 0-4.216 3.422-7.638 7.64-7.638z"/>
            </svg>
            Escríbenos por WhatsApp
          </button>

          <div class="flex flex-wrap justify-center sm:justify-around gap-3 pt-1 border-t border-white/10 text-xs text-slate-400">
            <span class="flex items-center gap-1"><span class="text-[#C58B59]">✓</span> Diagnóstico gratis</span>
            <span class="flex items-center gap-1"><span class="text-[#C58B59]">✓</span> Instalación incluida</span>
          </div>
        </div>

        <!-- Right: Form -->
        <div class="p-7 sm:p-8 lg:p-10 bg-white">
          <h3 class="text-base sm:text-lg font-bold text-[#0A1F33] font-headline mb-5">Cotización Rápida</h3>
          <form (ngSubmit)="submitQuote()" class="space-y-3.5 sm:space-y-4">

            <!-- Name + phone: 2-col on sm+, 1-col on xs -->
            <div class="grid grid-cols-1 xs:grid-cols-2 sm:grid-cols-2 gap-3">
              <div>
                <label for="fullName" class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">Nombre *</label>
                <input type="text" id="fullName" name="fullName" [(ngModel)]="formData.fullName" required
                  placeholder="Juan Pérez"
                  class="w-full px-3 py-2.5 bg-slate-50 rounded-xl border border-slate-200 focus:border-[#C58B59] focus:ring-1 focus:ring-[#C58B59]/30 text-sm outline-none transition-all">
              </div>
              <div>
                <label for="phone" class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">Celular *</label>
                <input type="tel" id="phone" name="phone" [(ngModel)]="formData.phone" required
                  placeholder="999 888 777"
                  class="w-full px-3 py-2.5 bg-slate-50 rounded-xl border border-slate-200 focus:border-[#C58B59] focus:ring-1 focus:ring-[#C58B59]/30 text-sm outline-none transition-all">
              </div>
            </div>

            <div>
              <label for="carModel" class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">Auto / Modelo (opcional)</label>
              <input type="text" id="carModel" name="carModel" [(ngModel)]="formData.carModel"
                placeholder="Ej: Toyota Yaris 2018"
                class="w-full px-3 py-2.5 bg-slate-50 rounded-xl border border-slate-200 focus:border-[#C58B59] focus:ring-1 focus:ring-[#C58B59]/30 text-sm outline-none transition-all">
            </div>

            <div>
              <label for="district" class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">Distrito</label>
              <select id="district" name="district" [(ngModel)]="formData.district"
                class="w-full px-3 py-2.5 bg-slate-50 rounded-xl border border-slate-200 focus:border-[#C58B59] focus:ring-1 focus:ring-[#C58B59]/30 text-sm outline-none transition-all">
                <option value="" disabled>Selecciona tu distrito</option>
                @for (d of districts; track d) {
                  <option [value]="d">{{ d }}</option>
                }
              </select>
            </div>

            <button type="submit"
              class="w-full py-3 sm:py-3.5 px-6 rounded-xl bg-[#0A1F33] hover:bg-[#132B45] text-white font-bold text-sm transition-all shadow-md cursor-pointer"
              id="cta-form-submit"
            >
              Solicitar Cotización →
            </button>

            @if (submitted()) {
              <div class="p-2.5 bg-green-50 border border-green-200 text-green-700 text-xs rounded-xl text-center font-medium">
                ✅ Redirigiendo a WhatsApp con tu solicitud...
              </div>
            }

          </form>
        </div>

      </div>
    </div>

  </div>
</section>
