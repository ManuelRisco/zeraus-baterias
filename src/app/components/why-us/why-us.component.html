<section id="nosotros" class="bg-[#0A1F33] text-white py-14 sm:py-20 lg:py-24 relative overflow-hidden">

  <div class="absolute -top-40 -left-40 w-96 h-96 bg-[#C58B59]/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 lg:gap-16 items-center">

      <!-- Left: text content -->
      <div class="space-y-6 sm:space-y-8">

          <h2 class="text-3xl sm:text-4xl md:text-5xl font-extrabold font-headline leading-tight">
            Tu batería,<br />
            <span class="text-[#C58B59]">nuestra misión.</span>
          </h2>
        </div>

        <div class="space-y-4 sm:space-y-5">
          <!-- Pilar 1 -->
          <div class="flex items-center gap-3 sm:gap-4">
            <div
              class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-white/10 border border-[#C58B59]/40 flex items-center justify-center shrink-0 text-[#C58B59]">
              <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0011 15.9V19H7v2h10v-2h-4v-3.1a5.01 5.01 0 003.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z" />

              <p class="text-slate-400 text-xs sm:text-sm">Empresa local, ubicada en Ate</p>
            </div>
          </div>
          <!-- Pilar 2   -->
          <div class="flex items-center gap-3 sm:gap-4">
            <div
              class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-white/10 border border-[#E65100]/40 flex items-center justify-center shrink-0 text-[#E65100]">
              <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="currentColor" viewBox="0 0 24 24">
                <path d="M13 10V3L4 14h7v7l9-11h-7z" />
              </svg>
            </div>
            <div>
              <p class="font-bold text-white text-sm sm:text-base">30-45 min de llegada</p>
              <p class="text-slate-400 text-xs sm:text-sm">A domicilio, cochera u oficina — 24/7</p>
            </div>
          </div>
        </div>

        <a href="#cotizar"
          class="inline-flex items-center gap-2 px-6 sm:px-8 py-3 sm:py-3.5 rounded-full bg-[#C58B59] hover:bg-[#A46E3F] text-white font-bold text-sm transition-all hover:scale-105 shadow-lg">
          Cotizar ahora
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />

      </div>

      <!-- Right: Owner photo — hidden on mobile to save space, shown from lg -->
      <div class="relative hidden sm:block">
        <div class="relative rounded-3xl overflow-hidden shadow-2xl border border-white/10 group">
          <img src="/images/owner_van.jpg" alt="Fundador de Zeraus Baterías con unidad móvil"
            class="w-full h-[380px] sm:h-[440px] lg:h-[500px] object-cover object-center group-hover:scale-105 transition-transform duration-700"
            loading="lazy">
          <div class="absolute inset-0 bg-gradient-to-t from-[#0A1F33]/80 via-transparent to-transparent"></div>

          <!-- Active badge -->
          <div
            class="absolute top-4 left-4 bg-[#0A1F33]/85 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20 flex items-center gap-2">

            <span class="text-xs font-bold text-white uppercase tracking-wider">Unidad Activa</span>

        </div>
      </div>

      <!-- Mobile-only stats strip (shown instead of photo on small screens) -->
      <div class="grid grid-cols-3 gap-3 sm:hidden">
        <div class="bg-white/10 rounded-2xl p-4 text-center border border-[#C58B59]/30">
          <p class="text-2xl font-black text-[#C58B59] font-headline">+5k</p>
          <p class="text-[11px] text-slate-300 font-medium">Instaladas</p>
        </div>
        <div class="bg-white/10 rounded-2xl p-4 text-center border border-white/10">
          <p class="text-2xl font-black text-amber-400 font-headline">4.9★</p>
          <p class="text-[11px] text-slate-300 font-medium">Google</p>
        </div>
        <div class="bg-white/10 rounded-2xl p-4 text-center border border-white/10">
          <p class="text-2xl font-black text-[#E65100] font-headline">24/7</p>
          <p class="text-[11px] text-slate-300 font-medium">Lima</p>
        </div>
      </div>

    </div>
